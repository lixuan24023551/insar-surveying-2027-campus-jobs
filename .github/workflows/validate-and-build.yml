name: validate-and-build

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: python3 -m pip install -r requirements.txt
      - name: Validate CSV and rebuild outputs
        run: python3 scripts/build_outputs.py
      - name: Check generated README is synchronized
        run: git diff --exit-code -- README.md
